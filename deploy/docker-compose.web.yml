# Tambahkan service "web" ini ke docker-compose.yml di VPS (jaringan yang sama dengan
# caddy, api, db). Dengan begitu Next.js bisa memanggil MariaDB lewat host "db" dan
# Caddy bisa meneruskan ke "web:3000" tanpa membuka port 3000 ke publik.
services:
  web:
    build: /path/ke/JM-Travel-Umroh-Haji   # ganti dengan lokasi clone repo ini di VPS
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${WEB_DB_USER}
      DB_PASSWORD: ${WEB_DB_PASSWORD}
      DB_NAME: ${WEB_DB_NAME}
      # Wajib; compose menolak start kalau kosong (tanpa ini login selalu 500).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}   # HARUS sama dengan JWT_SECRET service api
      # Cookie login ber-flag Secure di production = situs WAJIB HTTPS. Isi
      # COOKIE_SECURE=false HANYA untuk uji sementara lewat http://IP-VPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - web_private_uploads:/app/private-uploads
      - web_public_uploads:/app/public/uploads
    depends_on:
      - db

volumes:
  web_private_uploads:
  web_public_uploads:
