# Tambahkan service "web" ini ke docker-compose.yml di VPS (jaringan yang sama dengan
# caddy, api, db). Dengan begitu Next.js bisa memanggil MariaDB lewat host "db" dan
# Caddy bisa meneruskan ke "web:3000" tanpa membuka port 3000 ke publik.
services:
  web:
    build:
      context: /path/ke/JM-Travel-Umroh-Haji   # ganti dengan lokasi clone repo ini di VPS
      # NEXT_PUBLIC_* WAJIB lewat build.args (bukan cuma environment: di
      # bawah) — diinline webpack ke bundle client SAAT `docker compose
      # build`, environment: runtime container gak kebaca sama sekali di
      # titik itu (bug ditemukan & diperbaiki 2026-09-28: reCAPTCHA/GA4/
      # Pixel/SnapWidget IG kemungkinan gak pernah nyala di produksi
      # meskipun env-nya udah diisi, gara-gara cuma masuk environment: doang).
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_SNAPWIDGET_ID: ${NEXT_PUBLIC_SNAPWIDGET_ID:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_FB_PIXEL_ID: ${NEXT_PUBLIC_FB_PIXEL_ID:-}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${WEB_DB_USER}
      DB_PASSWORD: ${WEB_DB_PASSWORD}
      DB_NAME: ${WEB_DB_NAME}
      # Wajib; compose menolak start kalau kosong (tanpa ini login selalu 500).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}   # HARUS sama dengan JWT_SECRET service api
      # Cookie login ber-flag Secure di production = situs WAJIB HTTPS. Isi
      # COOKIE_SECURE=false HANYA untuk uji sementara lewat http://IP-VPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Alamat publik situs, dipakai untuk link di ID card (default-nya localhost).
      APP_URL: ${APP_URL:-https://jmtourtravel.com}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # TTD digital + e-Meterai — satu vendor Mekari Sign buat dua-duanya
      # (lihat .env.local buat penjelasan & TODO sebelum ganti ke 'mekari').
      TTD_PROVIDER: ${TTD_PROVIDER:-mock}
      MATERAI_PROVIDER: ${MATERAI_PROVIDER:-mock}
      MEKARI_API_BASE_URL: ${MEKARI_API_BASE_URL:-}
      MEKARI_BEARER_TOKEN: ${MEKARI_BEARER_TOKEN:-}
      MEKARI_WEBHOOK_SECRET: ${MEKARI_WEBHOOK_SECRET:-}
    volumes:
      - web_private_uploads:/app/private-uploads
      - web_public_uploads:/app/public/uploads
    depends_on:
      - db

volumes:
  web_private_uploads:
  web_public_uploads:
